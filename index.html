<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prøxy Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }
    .browser { display: flex; flex-direction: column; height: 100vh; }
    .toolbar {
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #3a3a3a; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn.primary { background: #6366f1; border-color: #6366f1; }
    .btn.primary:hover { background: #818cf8; }
    .address-bar {
      flex: 1;
      display: flex;
      background: #0f0f0f;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 0 12px;
      height: 38px;
      align-items: center;
      gap: 8px;
    }
    .address-bar input {
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-size: 14px;
      width: 100%;
      outline: none;
    }
    .address-bar input::placeholder { color: #666; }
    .badge {
      background: #6366f1;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .viewport { flex: 1; position: relative; background: #1a1a1a; }
    iframe { width: 100%; height: 100%; border: none; }
    .loading {
      position: absolute; inset: 0;
      background: #0a0a0a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 10;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #333;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: #888; font-size: 14px; }
    .hidden { display: none !important; }
    .status {
      background: #1a1a1a;
      border-top: 1px solid #333;
      padding: 6px 16px;
      font-size: 12px;
      color: #888;
      display: flex;
      justify-content: space-between;
    }
    .status .url { color: #6366f1; }
    .error {
      position: absolute; inset: 0;
      background: #0a0a0a;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; z-index: 20;
    }
    .error.active { display: flex; }
    .error h2 { color: #ef4444; }
    .error p { color: #888; max-width: 400px; text-align: center; }
  </style>
</head>
<body>
  <div class="browser">
    <div class="toolbar">
      <button class="btn" id="backBtn" onclick="goBack()" disabled>←</button>
      <button class="btn" id="fwdBtn" onclick="goForward()" disabled>→</button>
      <button class="btn" onclick="reload()">↻</button>
      <button class="btn" onclick="goHome()">🏠</button>
      <div class="address-bar">
        <span>🔍</span>
        <input type="text" id="urlInput" placeholder="Search or enter URL"
               onkeydown="if(event.key==='Enter')loadUrl()">
      </div>
      <button class="btn primary" onclick="loadUrl()">Go</button>
      <span class="badge">PROXY</span>
    </div>

    <div class="viewport">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading via proxy...</p>
      </div>
      <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation-by-user-activation"></iframe>
      <div class="error" id="error">
        <h2>⚠️ Can't Load</h2>
        <p id="errorMsg">This site blocks proxies.</p>
        <button class="btn" onclick="hideError()">Dismiss</button>
      </div>
    </div>

    <div class="status">
      <span id="statusText">Ready</span>
      <span class="url" id="urlDisplay">about:blank</span>
    </div>
  </div>

  <script>
    const PROXY_BACKEND = 'https://qwertyuiop-dm2v.onrender.com';

    let history = [];
    let idx = -1;

    // Wake up the backend
    fetch(PROXY_BACKEND + '/').catch(() => {});

    function isUrl(input) {
      return /^https?:\/\//i.test(input) || (input.includes('.') && !input.includes(' ') && input.length > 4);
    }

    function isYouTube(url) {
      return /(youtube\.com|youtu\.be)/i.test(url);
    }

    function wrapProxy(target) {
      return `${PROXY_BACKEND}/proxy?url=${encodeURIComponent(target)}`;
    }

    function loadUrl() {
      const input = document.getElementById('urlInput').value.trim();
      if (!input) return;

      let target;

      if (isUrl(input)) {
        target = input.match(/^https?:\/\//i) ? input : 'https://' + input;
      } else {
        // Search via DuckDuckGo HTML proxy (renders in iframe)
        target = `${PROXY_BACKEND}/ddg?q=${encodeURIComponent(input)}`;
        navigate(target, `Search: ${input}`, true);
        return;
      }

      // YouTube -> use dedicated /youtube/ route for full URL rewriting
      if (isYouTube(target)) {
        const ytPath = target.replace(/^https?:\/\//, '');
        navigate(`${PROXY_BACKEND}/youtube/${ytPath}`, target, true);
        return;
      }

      const proxied = wrapProxy(target);
      navigate(proxied, target, true);
    }

    function navigate(proxiedUrl, displayUrl, save) {
      const frame = document.getElementById('frame');
      const loading = document.getElementById('loading');
      const status = document.getElementById('statusText');
      const display = document.getElementById('urlDisplay');

      hideError();
      loading.classList.remove('hidden');
      status.textContent = 'Loading...';

      frame.src = proxiedUrl;
      document.getElementById('urlInput').value = displayUrl;
      display.textContent = displayUrl;

      let loaded = false;
      frame.onload = () => {
        loaded = true;
        loading.classList.add('hidden');
        status.textContent = 'Done';
        if (save) addHistory(displayUrl);
      };

      frame.onerror = () => {
        loading.classList.add('hidden');
        showError('Failed to load.');
      };

      setTimeout(() => {
        if (!loading.classList.contains('hidden')) {
          loading.classList.add('hidden');
          status.textContent = loaded ? 'Done' : 'Timeout';
          if (save && !loaded) addHistory(displayUrl);
        }
      }, 20000);
    }

    function addHistory(url) {
      if (idx < history.length - 1) history = history.slice(0, idx + 1);
      if (history[history.length - 1] !== url) {
        history.push(url);
        if (history.length > 50) history.shift();
        idx = history.length - 1;
        localStorage.setItem('proxyHistory', JSON.stringify(history));
      }
      updateButtons();
    }

    function updateButtons() {
      document.getElementById('backBtn').disabled = idx <= 0;
      document.getElementById('fwdBtn').disabled = idx >= history.length - 1;
    }

    function goBack() { 
      if (idx > 0) { 
        idx--; 
        loadFromHistory(history[idx]); 
      } 
    }
    
    function goForward() { 
      if (idx < history.length - 1) { 
        idx++; 
        loadFromHistory(history[idx]); 
      } 
    }

    function loadFromHistory(url) {
      if (url.startsWith('Search:')) {
        const query = url.replace('Search: ', '');
        navigate(`${PROXY_BACKEND}/ddg?q=${encodeURIComponent(query)}`, url, false);
      } else if (isYouTube(url)) {
        const ytPath = url.replace(/^https?:\/\//, '');
        navigate(`${PROXY_BACKEND}/youtube/${ytPath}`, url, false);
      } else {
        navigate(wrapProxy(url), url, false);
      }
    }
    
    function reload() { 
      if (idx >= 0) loadFromHistory(history[idx]);
    }

    function goHome() {
      document.getElementById('urlInput').value = '';
      document.getElementById('frame').src = 'about:blank';
      document.getElementById('urlDisplay').textContent = 'about:blank';
      document.getElementById('statusText').textContent = 'Ready';
    }

    function showError(msg) {
      document.getElementById('errorMsg').textContent = msg;
      document.getElementById('error').classList.add('active');
    }

    function hideError() {
      document.getElementById('error').classList.remove('active');
    }

    const saved = localStorage.getItem('proxyHistory');
    if (saved) { history = JSON.parse(saved); idx = history.length - 1; updateButtons(); }

    document.getElementById('urlInput').focus();
  </script>
</body>
</html>
