<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prøxy Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }
    .browser {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #3a3a3a; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn.primary {
      background: #6366f1;
      border-color: #6366f1;
    }
    .btn.primary:hover { background: #818cf8; }
    .address-bar {
      flex: 1;
      display: flex;
      background: #0f0f0f;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 0 12px;
      height: 38px;
      align-items: center;
    }
    .address-bar input {
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-size: 14px;
      width: 100%;
      outline: none;
    }
    .badge {
      background: #6366f1;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .viewport {
      flex: 1;
      position: relative;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #333;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: #888; font-size: 14px; }
    .hidden { display: none !important; }
    .status {
      background: #1a1a1a;
      border-top: 1px solid #333;
      padding: 6px 16px;
      font-size: 12px;
      color: #888;
      display: flex;
      justify-content: space-between;
    }
    .status .url { color: #6366f1; }
    .error {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
    }
    .error.active { display: flex; }
    .error h2 { color: #ef4444; }
    .error p { color: #888; max-width: 400px; text-align: center; }
  </style>
</head>
<body>
  <div class="browser">
    <div class="toolbar">
      <button class="btn" id="backBtn" onclick="goBack()" disabled>←</button>
      <button class="btn" id="fwdBtn" onclick="goForward()" disabled>→</button>
      <button class="btn" onclick="reload()">↻</button>
      <button class="btn" onclick="goHome()">🏠</button>
      <div class="address-bar">
        <input type="text" id="urlInput" placeholder="example.com" 
               onkeydown="if(event.key==='Enter')loadUrl()">
      </div>
      <button class="btn primary" onclick="loadUrl()">Go</button>
      <span class="badge">PROXY</span>
    </div>

    <div class="viewport">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading via proxy...</p>
      </div>
      <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      <div class="error" id="error">
        <h2>⚠️ Failed to Load</h2>
        <p id="errorMsg">Could not reach the website.</p>
        <button class="btn" onclick="hideError()">Dismiss</button>
      </div>
    </div>

    <div class="status">
      <span id="statusText">Ready</span>
      <span class="url" id="urlDisplay">about:blank</span>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIG: Put your Render backend URL here
    // ============================================
    const PROXY_BACKEND = 'https://qwertyuiop-dm2v.onrender.com';
    // Example: 'https://proxy-server-abc123.onrender.com'
    // ============================================

    let history = [];
    let idx = -1;

    function loadUrl() {
      const input = document.getElementById('urlInput').value.trim();
      if (!input) return;

      let url = input;
      if (!url.match(/^https?:\/\//i)) url = 'https://' + url;

      try { new URL(url); } catch {
        showError('Invalid URL');
        return;
      }

      navigate(url, true);
    }

    function navigate(url, save) {
      const frame = document.getElementById('frame');
      const loading = document.getElementById('loading');
      const status = document.getElementById('statusText');
      const display = document.getElementById('urlDisplay');

      hideError();
      loading.classList.remove('hidden');
      status.textContent = 'Loading...';

      // Call your backend proxy
      const proxyUrl = `${PROXY_BACKEND}/proxy?url=${encodeURIComponent(url)}`;
      
      frame.src = proxyUrl;
      document.getElementById('urlInput').value = url;
      display.textContent = url;

      frame.onload = () => {
        loading.classList.add('hidden');
        status.textContent = 'Done';
        if (save) addHistory(url);
      };

      frame.onerror = () => {
        loading.classList.add('hidden');
        showError('Site blocked the proxy or is unavailable.');
      };

      setTimeout(() => {
        if (!loading.classList.contains('hidden')) {
          loading.classList.add('hidden');
          status.textContent = 'Loaded';
          if (save) addHistory(url);
        }
      }, 15000);
    }

    function addHistory(url) {
      if (idx < history.length - 1) history = history.slice(0, idx + 1);
      if (history[history.length - 1] !== url) {
        history.push(url);
        if (history.length > 50) history.shift();
        idx = history.length - 1;
        localStorage.setItem('proxyHistory', JSON.stringify(history));
      }
      updateButtons();
    }

    function updateButtons() {
      document.getElementById('backBtn').disabled = idx <= 0;
      document.getElementById('fwdBtn').disabled = idx >= history.length - 1;
    }

    function goBack() {
      if (idx > 0) { idx--; navigate(history[idx], false); }
    }

    function goForward() {
      if (idx < history.length - 1) { idx++; navigate(history[idx], false); }
    }

    function reload() {
      if (idx >= 0) navigate(history[idx], false);
    }

    function goHome() {
      document.getElementById('urlInput').value = '';
      document.getElementById('frame').src = 'about:blank';
      document.getElementById('urlDisplay').textContent = 'about:blank';
      document.getElementById('statusText').textContent = 'Ready';
    }

    function showError(msg) {
      document.getElementById('errorMsg').textContent = msg;
      document.getElementById('error').classList.add('active');
    }

    function hideError() {
      document.getElementById('error').classList.remove('active');
    }

    // Load saved history
    const saved = localStorage.getItem('proxyHistory');
    if (saved) {
      history = JSON.parse(saved);
      idx = history.length - 1;
      updateButtons();
    }

    document.getElementById('urlInput').focus();
  </script>
</body>
</html>
